<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<title>即売会リスト</title>
<style>
:root{--bg:#f7f5f1;--paper:#fff;--ink:#242522;--muted:#77786f;--line:#e8e5dd;--accent:#425f50;--accent-light:#e8eee9;--orange:#b7653c;--danger:#a7443d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) 0 calc(22px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:20px 15px 36px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:800}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:5px 0 18px}h1{font-size:29px;line-height:1.2;margin:5px 0 7px;letter-spacing:-.04em}.sub{font-size:13px;color:var(--muted);margin:0}.event-tag{font-size:11px;white-space:nowrap;background:var(--accent-light);color:var(--accent);padding:7px 10px;border-radius:99px;font-weight:700;margin-top:8px}
.event-panel,.panel,.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}.event-panel{margin-bottom:16px}.event-controls{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:11px;font-weight:700;color:var(--muted)}input,select,textarea,button{font:inherit}.field input,.field select,.field textarea,.event-controls select{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 10px;background:#fff;color:var(--ink);font-size:14px;outline-color:var(--accent)}.event-buttons{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.primary{border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:14px;font-weight:750;padding:12px 14px;cursor:pointer}.secondary{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;cursor:pointer}.danger{color:var(--danger)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:22px;font-weight:800;letter-spacing:-.04em;margin-top:4px}.stat-value small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}.stat.wide{grid-column:1/-1}.budget-line{display:flex;justify-content:space-between;align-items:center;gap:12px}.budget-edit{display:flex;align-items:center;gap:5px}.budget-edit input{width:105px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:15px;text-align:right;background:#fff;color:var(--ink)}.progress{height:6px;background:#eeece5;border-radius:9px;overflow:hidden;margin-top:11px}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:23px 2px 10px}.section-head h2{font-size:16px;margin:0}.count{font-size:12px;color:var(--muted)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}.primary.full{width:100%;margin-top:12px}.toolbar{display:flex;gap:6px;align-items:center}.toolbar select{max-width:145px;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;font-size:12px;color:var(--ink)}.list{display:flex;flex-direction:column;gap:9px}.item{display:grid;grid-template-columns:25px 1fr auto;gap:9px;align-items:start;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px}.check{appearance:none;width:23px;height:23px;border:1.5px solid #c9c9bf;border-radius:7px;margin:2px 0 0;display:grid;place-items:center;cursor:pointer}.check:checked{background:var(--accent);border-color:var(--accent)}.check:checked:after{content:"✓";color:#fff;font-size:15px;font-weight:800}.item-main{min-width:0}.item-title{font-size:15px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}.item.purchased .item-title{text-decoration:line-through;color:#8c8d85}.item-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6;overflow-wrap:anywhere}.place{display:inline-block;background:#f0eee8;border-radius:5px;padding:2px 6px;color:#56584f;font-weight:700;margin-right:5px}.item-price{text-align:right;white-space:nowrap;font-size:14px;font-weight:800}.item-price small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}.item-actions{display:flex;gap:5px;justify-content:flex-start;margin-top:8px}.tiny{border:0;background:transparent;color:var(--muted);font-size:11px;padding:3px;cursor:pointer}.tiny.delete{color:var(--danger)}.priority{display:inline-block;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:800;margin:0 5px 3px 0}.priority.high{background:#f8e4df;color:#9a3d2e}.priority.medium{background:#fff0cf;color:#805d13}.priority.low{background:#e7eee8;color:#45624d}.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:13px;background:rgba(255,255,255,.55);border:1px dashed #d9d6cc;border-radius:14px}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}.map-box{margin-top:12px}.map-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.map-head h3{font-size:14px;margin:0}.map-preview{display:block;width:100%;max-height:440px;object-fit:contain;background:#f4f2ec;border:1px solid var(--line);border-radius:10px;margin-top:10px}.map-note{font-size:11px;color:var(--muted);line-height:1.5;margin:7px 0 0}.footer{font-size:11px;color:var(--muted);line-height:1.7;margin:18px 3px}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#242522;color:white;padding:10px 15px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.toast.show{opacity:1}.hidden{display:none!important}
@media(min-width:560px){main{padding-top:30px}.stats{grid-template-columns:repeat(3,1fr)}.stat.wide{grid-column:auto}.fields{grid-template-columns:repeat(4,1fr)}.field.full{grid-column:span 2}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">EVENT DAY COMPANION</div>
  <div class="top"><div><h1>即売会リスト</h1><p class="sub">イベントごとに、買い忘れを減らそう。</p></div><span class="event-tag">同人誌・グッズ</span></div>

  <section class="event-panel">
    <div class="field"><label for="eventSelect">イベントを選択</label><select id="eventSelect" aria-label="イベントを選択"></select></div>
    <div class="field" style="margin-top:10px"><label for="eventDate">開催日</label><input id="eventDate" type="date" aria-label="イベント開催日"></div>
    <div class="event-buttons"><button class="primary" id="newEventBtn" type="button">＋ イベントを作成</button><button class="secondary" id="renameEventBtn" type="button">名前を変更</button><button class="secondary danger" id="deleteEventBtn" type="button">イベントを削除</button></div>
    <div class="map-box">
      <div class="map-head"><h3>会場マップ</h3><button class="secondary" id="mapPickBtn" type="button">画像を追加・変更</button></div>
      <input id="mapFile" type="file" accept="image/*" class="hidden">
      <img id="mapPreview" class="map-preview hidden" alt="このイベントの会場マップ">
      <p class="map-note" id="mapNote">会場マップの画像を選ぶと、イベントごとに保存されます。画像は端末内に保存されます。</p>
      <button class="secondary danger hidden" id="removeMapBtn" type="button" style="margin-top:8px">マップを削除</button>
    </div>
  </section>

  <section class="stats" aria-label="購入状況">
    <div class="stat"><div class="stat-label">購入予定額</div><div class="stat-value" id="planned">¥0</div></div>
    <div class="stat"><div class="stat-label">購入済み金額</div><div class="stat-value" id="spent">¥0</div></div>
    <div class="stat wide">
      <div class="budget-line"><div><div class="stat-label">このイベントの予算</div><div class="stat-value" id="remaining">¥0 <small>残り</small></div></div><div class="budget-edit"><span class="stat-label">¥</span><input id="budget" type="number" min="0" step="500" value="10000" aria-label="予算"></div></div>
      <div class="progress"><span id="progress"></span></div><div class="stat-label" id="budgetNote" style="margin-top:7px">予算を設定できます</div>
    </div>
  </section>

  <div class="section-head"><h2 id="formHeading">＋ リストに追加</h2><span class="count">手入力</span></div>
  <form class="panel" id="itemForm">
    <div class="fields">
      <div class="field full"><label for="circle">サークル・作家名 *</label><input id="circle" required maxlength="100" placeholder="例：サンプルサークル"></div>
      <div class="field full"><label for="title">本・グッズ名 *</label><input id="title" required maxlength="120" placeholder="例：新刊『タイトル』"></div>
      <div class="field"><label for="place">配置番号</label><input id="place" maxlength="30" placeholder="例：東A-12a"></div>
      <div class="field"><label for="priority">購入優先度</label><select id="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div>
      <div class="field"><label for="price">単価（円）</label><input id="price" type="number" min="0" step="1" value="500" inputmode="numeric"></div>
      <div class="field"><label for="qty">購入数</label><input id="qty" type="number" min="1" step="1" value="1" inputmode="numeric"></div>
      <div class="field full"><label for="note">メモ</label><input id="note" maxlength="160" placeholder="限定・差し入れなど"></div>
    </div>
    <button class="primary full" id="saveBtn" type="submit">リストに追加</button>
    <button class="secondary hidden" id="cancelEdit" type="button" style="width:100%;margin-top:8px">編集をキャンセル</button>
  </form>

  <div class="section-head"><h2>購入リスト <span id="itemCount" class="count">0件</span></h2>
    <div class="toolbar"><select id="filter" aria-label="表示する商品"><option value="all">すべて</option><option value="todo">未購入のみ</option><option value="done">購入済みのみ</option></select><select id="sort" aria-label="並び順"><option value="place">配置番号順</option><option value="priority">優先度順</option><option value="added">追加した順</option><option value="price">金額が高い順</option><option value="todo">未購入を先に</option></select></div>
  </div>
  <div id="list" class="list"></div>
  <p class="footer">イベントごとのリスト・予算・会場マップは、このブラウザ内に保存されます。端末変更やブラウザのデータ消去に備えて、CSVを書き出してバックアップしてください。会場マップは画像サイズを小さくして保存します。</p>
  <div style="display:flex;gap:8px"><button class="secondary" id="exportBtn" style="flex:1">このイベントを書き出す（CSV）</button><button class="secondary" id="clearBtn">このリストを全削除</button></div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const KEY='event-purchase-list-v1';
const V2KEY='event-purchase-list-v2';
let events=[],activeEventId=null,editingId=null;
const $=id=>document.getElementById(id);
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=()=>events.find(e=>e.id===activeEventId)||events[0];
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){
 try{
  const v2=localStorage.getItem(V2KEY);
  if(v2){const d=JSON.parse(v2);events=Array.isArray(d.events)?d.events:[];activeEventId=d.activeEventId||events[0]?.id||null;}
  if(!events.length){
   let old=null;try{old=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
   events=[{id:makeId(),name:'イベント1',budget:old?.budget??10000,items:Array.isArray(old?.items)?old.items.map(x=>({...x,priority:x.priority||'medium'})):[],mapData:null}];
   activeEventId=events[0].id;persist();
  }
 }catch(e){events=[{id:makeId(),name:'イベント1',budget:10000,items:[],mapData:null}];activeEventId=events[0].id;}
 events=events.map(e=>({...e,date:e.date||''}));\n if(!activeEventId||!events.some(e=>e.id===activeEventId))activeEventId=events[0].id;
}
function persist(){try{localStorage.setItem(V2KEY,JSON.stringify({events,activeEventId}));}catch(e){toast('保存できませんでした。マップ画像が大きすぎる可能性があります');}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
function renderEventSelect(){const current=activeEventId;$('eventSelect').innerHTML=events.map(e=>`<option value="${e.id}">${safe(e.name)}</option>`).join('');$('eventSelect').value=current}
function renderMap(){const e=active();if(e?.mapData){$('mapPreview').src=e.mapData;$('mapPreview').classList.remove('hidden');$('removeMapBtn').classList.remove('hidden');$('mapNote').textContent='このイベントに保存された会場マップです。画像をタップすると拡大表示できます。'}else{$('mapPreview').removeAttribute('src');$('mapPreview').classList.add('hidden');$('removeMapBtn').classList.add('hidden');$('mapNote').textContent='会場マップの画像を選ぶと、イベントごとに保存されます。画像は端末内に保存されます。'}}
function totals(){const e=active();if(!e)return;const items=e.items;const planned=items.reduce((s,x)=>s+x.price*x.qty,0),spent=items.filter(x=>x.done).reduce((s,x)=>s+x.price*x.qty,0),budget=Math.max(0,Number(e.budget)||0),remaining=budget-spent;$('planned').textContent=yen(planned);$('spent').textContent=yen(spent);$('remaining').innerHTML=yen(remaining)+' <small>'+(remaining<0?'予算超過':'残り')+'</small>';$('progress').style.width=(budget?Math.min(100,spent/budget*100):0)+'%';$('budgetNote').textContent=budget?(spent>budget?'予算を'+yen(spent-budget)+'超過しています':'予算の'+Math.round(spent/budget*100)+'%を使用（購入済み基準）'):'予算を入力してください';$('itemCount').textContent=items.length+'件';}
function placeKey(s){return String(s||'').toUpperCase().replace(/([A-Z])(\d)/g,'$1 $2').replace(/(\d+)([A-Z])/g,'$1 $2')}
const priorityRank={high:0,medium:1,low:2};
const priorityLabel={high:'高',medium:'中',low:'低'};
function render(){const e=active();if(!e)return;totals();let arr=[...e.items];const filter=$('filter').value,sort=$('sort').value;if(filter==='todo')arr=arr.filter(x=>!x.done);if(filter==='done')arr=arr.filter(x=>x.done);arr.sort((a,b)=>{if(sort==='place')return placeKey(a.place).localeCompare(placeKey(b.place),'ja',{numeric:true})||a.created-b.created;if(sort==='price')return b.price*b.qty-a.price*a.qty;if(sort==='todo')return Number(a.done)-Number(b.done)||a.created-b.created;if(sort==='priority')return priorityRank[a.priority||'medium']-priorityRank[b.priority||'medium']||a.created-b.created;return a.created-b.created});
 if(!arr.length){$('list').innerHTML='<div class="empty"><strong>'+(e.items.length?'該当する商品がありません':'購入リストはまだ空です')+'</strong>'+(e.items.length?'表示条件を変更してみてください':'上のフォームからサークルや商品を追加しよう。')+'</div>';return}
 $('list').innerHTML=arr.map(x=>`<article class="item ${x.done?'purchased':''}"><input class="check" type="checkbox" aria-label="${x.done?'未購入に戻す':'購入済みにする'}：${safe(x.title)}" data-check="${x.id}" ${x.done?'checked':''}><div class="item-main"><div class="item-title">${safe(x.title)}</div><div class="item-meta"><span class="priority ${x.priority||'medium'}">優先度：${priorityLabel[x.priority||'medium']||'中'}</span><br>${safe(x.circle)}<br>${x.place?'<span class="place">'+safe(x.place)+'</span>':''}${x.note?'<span>'+safe(x.note)+'</span>':''}</div><div class="item-actions"><button class="tiny" data-edit="${x.id}">編集</button><button class="tiny delete" data-delete="${x.id}">削除</button></div></div><div class="item-price">${yen(x.price*x.qty)}<small>${yen(x.price)} × ${x.qty}</small></div></article>`).join('')
}
function refresh(){renderEventSelect();$('budget').value=active().budget??10000;$('eventDate').value=active().date||'';renderMap();render()}
function resetForm(){$('itemForm').reset();$('price').value=500;$('qty').value=1;$('priority').value='medium';editingId=null;$('formHeading').textContent='＋ リストに追加';$('saveBtn').textContent='リストに追加';$('cancelEdit').classList.add('hidden')}
$('eventSelect').addEventListener('change',()=>{activeEventId=$('eventSelect').value;resetForm();persist();refresh()});
$('newEventBtn').addEventListener('click',()=>{const name=prompt('イベント名を入力してください（例：コミックマーケット108）');if(!name||!name.trim())return;const e={id:makeId(),name:name.trim().slice(0,80),date:'',budget:10000,items:[],mapData:null};events.push(e);activeEventId=e.id;resetForm();persist();refresh();toast('イベントを作成しました')});
$('renameEventBtn').addEventListener('click',()=>{const e=active();const name=prompt('イベント名を変更',e.name);if(!name||!name.trim())return;e.name=name.trim().slice(0,80);persist();refresh();toast('イベント名を変更しました')});
$('deleteEventBtn').addEventListener('click',()=>{if(events.length<=1){toast('最後のイベントは削除できません。名前を変更して使ってね');return}const e=active();if(!confirm('「'+e.name+'」と、その購入リスト・マップを削除しますか？'))return;events=events.filter(x=>x.id!==e.id);activeEventId=events[0].id;resetForm();persist();refresh();toast('イベントを削除しました')});
$('mapPickBtn').addEventListener('click',()=>$('mapFile').click());
$('mapFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('画像ファイルを選んでください');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);active().mapData=canvas.toDataURL('image/jpeg',0.78);persist();renderMap();toast('会場マップを保存しました')};img.onerror=()=>toast('画像を読み込めませんでした');img.src=reader.result};reader.readAsDataURL(file);e.target.value=''});
$('mapPreview').addEventListener('click',()=>{const e=active();if(e?.mapData){const w=window.open();if(w){w.document.write('<img src="'+e.mapData+'" style="max-width:100%;height:auto">');w.document.close()}}});
$('removeMapBtn').addEventListener('click',()=>{if(confirm('このイベントの会場マップを削除しますか？')){active().mapData=null;persist();renderMap();toast('会場マップを削除しました')}});
$('itemForm').addEventListener('submit',e=>{e.preventDefault();const ev=active();const data={circle:$('circle').value.trim(),title:$('title').value.trim(),place:$('place').value.trim(),priority:$('priority').value,price:Math.max(0,Number($('price').value)||0),qty:Math.max(1,Math.floor(Number($('qty').value)||1)),note:$('note').value.trim()};if(!data.circle||!data.title)return;if(editingId){const i=ev.items.findIndex(x=>x.id===editingId);if(i>=0)ev.items[i]={...ev.items[i],...data};toast('内容を更新しました')}else{ev.items.push({...data,id:makeId(),done:false,created:Date.now()});toast('リストに追加しました')}persist();resetForm();render()});
$('list').addEventListener('change',e=>{const id=e.target.dataset.check;if(!id)return;const x=active().items.find(x=>x.id===id);if(x){x.done=e.target.checked;persist();render()}});
$('list').addEventListener('click',e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete,ev=active();if(edit){const x=ev.items.find(x=>x.id===edit);if(!x)return;editingId=x.id;for(const k of ['circle','title','place','priority','price','qty','note'])$(k).value=x[k]??(k==='priority'?'medium':'');$('formHeading').textContent='商品を編集';$('saveBtn').textContent='変更を保存';$('cancelEdit').classList.remove('hidden');$('itemForm').scrollIntoView({behavior:'smooth',block:'start'})}if(del){const x=ev.items.find(x=>x.id===del);if(x&&confirm('「'+x.title+'」を削除しますか？')){ev.items=ev.items.filter(x=>x.id!==del);if(editingId===del)resetForm();persist();render();toast('削除しました')}}});
$('cancelEdit').addEventListener('click',resetForm);
$('eventDate').addEventListener('change',()=>{active().date=$('eventDate').value;persist();toast('開催日を保存しました')});\n$('budget').addEventListener('input',()=>{active().budget=Math.max(0,Number($('budget').value)||0);persist();totals()});
$('filter').addEventListener('change',render);$('sort').addEventListener('change',render);
$('exportBtn').addEventListener('click',()=>{const e=active();if(!e.items.length){toast('書き出す商品がありません');return}const rows=[['イベント名',e.name],['開催日',e.date||'未設定'],[],['購入済み','優先度','サークル・作家','商品名','配置番号','単価','購入数','小計','メモ'],...e.items.map(x=>[x.done?'購入済み':'未購入',priorityLabel[x.priority||'medium'],x.circle,x.title,x.place,x.price,x.qty,x.price*x.qty,x.note])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=(e.name.replace(/[\\/:*?"<>|]/g,'_')||'即売会')+'_購入リスト.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSVを書き出しました')});
$('clearBtn').addEventListener('click',()=>{const e=active();if(e.items.length&&confirm('「'+e.name+'」の購入リストをすべて削除します。この操作は取り消せません。よろしいですか？')){e.items=[];resetForm();persist();render();toast('このリストを削除しました')}});
load();refresh();
})();
</script>
</body>
</html>
